name: Build Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/checkout@v5

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # The tag must match the version the bundlers will stamp on the
      # installers, or the release page and the artifacts disagree.
      - name: Check tag matches tauri.conf.json version
        run: |
          CONF=$(jq -r .version src-tauri/tauri.conf.json)
          PKG=$(jq -r .version package.json)
          TAG="${{ steps.version.outputs.version }}"
          if [ "$CONF" != "$TAG" ] || [ "$PKG" != "$TAG" ]; then
            echo "Tag ($TAG) != tauri.conf.json ($CONF) or package.json ($PKG) - bump both and retag"
            exit 1
          fi

      - name: Extract changelog entry
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # The block between "## [<version>]" and the next "## [" heading.
          extract() {
            awk -v ver="$1" '
              $0 ~ "^## \\["ver"\\]" { flag=1; next }
              flag && /^## \[/ { exit }
              flag { print }
            ' CHANGELOG.md
          }
          extract "$VERSION" > /tmp/release-body.md
          # A beta carries the block of the version it is heading for
          # (0.6.1-beta.1 -> "## [0.6.1]"), so testers read what changed.
          if [ ! -s /tmp/release-body.md ] && [[ "$VERSION" == *-* ]]; then
            extract "${VERSION%%-*}" > /tmp/release-body.md
          fi
          # GitHub renders release bodies like comments (a newline is a
          # line break), so the file's 76-column wrapping is undone here.
          node scripts/unwrap-release-notes.mjs /tmp/release-body.md

      - name: Create GitHub Release
        id: create-release
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const version = "${{ steps.version.outputs.version }}";
            // v0.1.0 is stable; v0.1.0-beta.1 / -rc.1 are pre-releases and
            // stay out of GitHub's "Latest" slot.
            const isPrerelease = version.includes('-');
            const tagline = "Private AI on your own machine - offline by default, online only when you choose.";
            const changelog = fs.readFileSync('/tmp/release-body.md', 'utf8').trim();
            const body = [
              `## Your Own AI v${version}`,
              '',
              tagline,
              '',
              changelog || '',
              '',
              '### Downloads',
              'See assets below for platform-specific installers. Verify any download against SHA256SUMS.txt.',
            ].join('\n');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `Your Own AI v${version}`,
              body,
              draft: true,
              prerelease: isPrerelease,
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          # Pinned to windows-2022 (VS 2022) - windows-latest rolled to a
          # VS 2026 image whose newer MSVC headers fail to compile
          # aws-lc-sys (rides in via the Holochain client). Same pin as
          # Flowsta Vault and this repo's CUDA engine builds.
          - platform: windows-2022
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      # The bundled inference engine: a PREBUILT llama-server from this repo's
      # pinned engine release (Vulkan on Linux/Windows, Metal on macOS - the
      # small default; the large CUDA builds on the same release are downloaded
      # by the app only when the user opts in). Nothing is compiled here.
      - name: Download llama-server binary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p src-tauri/bin
          REPO="WeAreFlowsta/Your-Own-AI"

          # PINNED llama.cpp engine version. Bump deliberately: run
          # build-llama-binaries.yml at a new tag, then update this one line.
          RELEASE_TAG="llama-b11669"

          # The app bakes this tag (engine.rs LLAMA_ENGINE_TAG) to download
          # optional engine builds from the same release - fail fast if the
          # two ever drift. (sed, not grep -P: macOS runners lack -P.)
          BAKED=$(sed -n 's/.*LLAMA_ENGINE_TAG: &str = "\([^"]*\)".*/\1/p' src-tauri/src/engine.rs)
          if [ "$BAKED" != "${RELEASE_TAG}" ]; then
            echo "engine.rs LLAMA_ENGINE_TAG (${BAKED:-missing}) != workflow RELEASE_TAG (${RELEASE_TAG}) - update both together"
            exit 1
          fi

          T="${{ matrix.target }}"
          EXT=""
          if [ "$T" = "x86_64-pc-windows-msvc" ]; then EXT=".exe"; fi
          BINARY="llama-server-${T}${EXT}"
          # Retry: GitHub's get-release-by-tag endpoint can 503/flap for
          # stretches (took out two beta-6 runs on 2026-07-16 while the
          # release itself was fine). The release is pinned and immutable,
          # so waiting out an API blip is always correct.
          for i in 1 2 3 4 5 6; do
            gh release download "${RELEASE_TAG}" --repo ${REPO} --pattern "${BINARY}" --dir src-tauri/bin/ && break
            echo "release download attempt ${i} failed; retrying in 90s"
            sleep 90
          done
          # gh release download can exit 0 with no file when the pattern
          # doesn't match - that would silently ship an installer with no
          # inference engine. Smallest real binary is ~11 MB.
          test -f "src-tauri/bin/${BINARY}" || { echo "${BINARY} did not download"; exit 1; }
          # Bundled under the app's own prefix: a Linux package never
          # claims /usr/bin/llama-server (distributions' llama.cpp has one).
          DEST="src-tauri/bin/yourowai-${BINARY}"
          mv "src-tauri/bin/${BINARY}" "$DEST"
          SIZE=$(wc -c < "$DEST")
          test "$SIZE" -gt 5000000 || { echo "${BINARY} too small (${SIZE} bytes)"; exit 1; }
          chmod +x "$DEST" 2>/dev/null || true
          echo "${BINARY} (${SIZE} bytes)"

      # The Holochain conductors and key stores, downloaded at build time and
      # checked against .github/holochain-sidecars.sha256 (nothing is compiled
      # here). 0.6.1 and both key stores are the official release binaries;
      # the 0.7.1 conductor is WeAreFlowsta/holochain-build's, the official
      # source with the patches listed in that repository. The binaries get a
      # yourowai- prefix so the installers never collide with other Holochain
      # apps' bundled conductors.
      - name: Download Holochain binaries
        shell: bash
        run: ./download-holochain-binaries.sh "${{ matrix.target }}"

      # pdfium renders scanned-PDF pages for OCR. tauri.conf bundles
      # resources/pdfium/* but the binaries are gitignored - without this
      # fetch, every installer silently ships without scanned-PDF support.
      - name: Fetch pdfium (scanned-PDF rendering for OCR)
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu) PDFIUM_TARGET="linux-x64" ;;
            aarch64-apple-darwin)     PDFIUM_TARGET="mac-arm64" ;;
            x86_64-apple-darwin)      PDFIUM_TARGET="mac-x64" ;;
            x86_64-pc-windows-msvc)   PDFIUM_TARGET="win-x64" ;;
            *) echo "No pdfium mapping for ${{ matrix.target }}"; exit 1 ;;
          esac
          ./scripts/fetch-pdfium.sh "$PDFIUM_TARGET"
          # Look for whichever platform library landed. (Not `ls a b c | head`:
          # ls exits non-zero for the two names that don't exist on this
          # platform, and the runner's pipefail turns that into a step failure
          # even though the file is present.)
          FILE=""
          for f in src-tauri/resources/pdfium/libpdfium.so \
                   src-tauri/resources/pdfium/libpdfium.dylib \
                   src-tauri/resources/pdfium/pdfium.dll; do
            if [ -f "$f" ]; then FILE="$f"; break; fi
          done
          test -n "$FILE" || { echo "pdfium did not download"; exit 1; }
          SIZE=$(wc -c < "$FILE")
          test "$SIZE" -gt 3000000 || { echo "pdfium too small (${SIZE} bytes)"; exit 1; }
          echo "$FILE (${SIZE} bytes)"

      - name: Install frontend dependencies
        run: npm ci

      - name: Import Apple certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db

      - name: Set up Apple API key (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$APPLE_API_KEY_PATH" | base64 --decode -o ~/private_keys/AuthKey_${APPLE_API_KEY}.p8

      # pdfium ships as a prebuilt dylib inside Resources. Tauri deep-signs
      # the app and its sidecar binaries but not resource dylibs, and Apple's
      # notarization rejects any unsigned Mach-O in the archive - so sign it
      # ourselves before the bundler copies it in. (Needs the certificate
      # imported above.)
      - name: Sign pdfium dylib (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" \
            src-tauri/resources/pdfium/libpdfium.dylib
          codesign --verify --verbose=2 src-tauri/resources/pdfium/libpdfium.dylib

      # BETA detection for the signing skip below (betas don't pay for
      # eSigner; see sign-windows.ps1). Release candidates and stable tags
      # sign as always - an rc should look exactly like the release.
      - name: Detect beta build
        id: prerelease
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-beta* ]]; then
            echo "is_beta=1" >> "$GITHUB_OUTPUT"
          else
            echo "is_beta=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java (Windows)
        if: runner.os == 'Windows' && steps.prerelease.outputs.is_beta == '0'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download CodeSignTool (Windows)
        if: runner.os == 'Windows' && steps.prerelease.outputs.is_beta == '0'
        shell: pwsh
        run: |
          $url = "https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2.zip"
          $zip = Join-Path $env:RUNNER_TEMP "CodeSignTool.zip"
          $dest = Join-Path $env:RUNNER_TEMP "CodeSignTool"
          Invoke-WebRequest -Uri $url -OutFile $zip
          # The tool is handed the eSigner secrets: only the pinned zip runs.
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne "f14b1e1ef14bfa1fd00279c363aab0debbf5dcfba0e4bcdce5d22bb771de0e3a") { throw "CodeSignTool v1.3.2: SHA-256 $got does not match the pinned f14b1e1ef14bfa1fd00279c363aab0debbf5dcfba0e4bcdce5d22bb771de0e3a" }
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          "CODE_SIGN_TOOL_DIR=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Per-platform bundle lists:
      # - macOS: dmg only (the default also produces a bare .app tarball we
      #   don't ship).
      # - Linux: deb + rpm only (AppImage never worked well with the bundled
      #   Holochain conductor).
      # - Windows: pre-release tags (e.g. v0.1.0-beta.1) skip the MSI - its
      #   bundler requires numeric-only pre-release identifiers and rejects
      #   "beta.1". NSIS has no such restriction and is what end users
      #   install anyway. Stable tags get MSI + NSIS.
      - name: Compute Tauri bundle args
        id: tauri_args
        shell: bash
        run: |
          EXTRA=""
          VERSION="${GITHUB_REF_NAME#v}"
          case "$RUNNER_OS" in
            # The app bundle too: the updater file (.app.tar.gz and its
            # signature) is made from it; with the dmg alone the .app is
            # cleaned away and macOS ships no update.
            macOS) EXTRA=" --bundles app,dmg" ;;
            Linux) EXTRA=" --bundles deb,rpm" ;;
            Windows)
              if [[ "$VERSION" == *-* ]]; then
                EXTRA=" --bundles nsis"
                echo "Pre-release detected ($VERSION) - skipping MSI bundle"
              fi
              ;;
          esac
          echo "extra=$EXTRA" >> "$GITHUB_OUTPUT"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The app's own rendezvous material: with it the conductor can meet
          # the person's other devices on bootstrap.flowsta.com (one person's
          # private network across devices); without it, it stays alone.
          FLOWSTA_AUTH_MATERIAL: ${{ secrets.FLOWSTA_AUTH_MATERIAL_PRODUCTION }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
          # Betas skip Windows Authenticode (per-signing eSigner cost);
          # sign-windows.ps1 no-ops when this is set. RCs and stables sign;
          # macOS signs + notarizes on every build (free, Gatekeeper needs it).
          YOAI_SKIP_WINDOWS_SIGNING: ${{ steps.prerelease.outputs.is_beta }}
          # The updater's own signature on each updater file (the public key
          # is in tauri.conf.json). Only release builds make updater files
          # (tauri.updater.conf.json below); test and local builds don't.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # The version file is written after the renames (publish-release),
          # so its links are the final names.
          includeUpdaterJson: false
          args: --target ${{ matrix.target }} --config src-tauri/tauri.updater.conf.json${{ steps.tauri_args.outputs.extra }}

      # The Linux app links nothing of the system's OpenSSL: Fedora 45 ships
      # OpenSSL 4, and 0.9.0, which needed libssl.so.3, did not start there
      # (2026-11-07). OpenSSL is built in (openssl-src); this keeps it so.
      - name: No system OpenSSL in the Linux app
        if: runner.os == 'Linux'
        shell: bash
        run: |
          BIN="src-tauri/target/${{ matrix.target }}/release/your-own-ai"
          if readelf -d "$BIN" | grep -E 'NEEDED.*lib(ssl|crypto)\.so'; then
            echo "$BIN needs the system's OpenSSL: it would not start on a system without that version"
            exit 1
          fi
          echo "$BIN needs no system OpenSSL"

      # The four sidecars' SHA-256 as they ship (after code signing; macOS
      # signs them at bundle time, so they differ from the upstream pins),
      # read from inside the final package and published beside the
      # downloads. A later release compiles them into its kit descriptors,
      # so a restored binary is checked against a hash from a signed release.
      - name: Sidecar hashes after signing
        shell: bash
        run: node scripts/kit-hashes.mjs "${{ matrix.target }}" "src-tauri/target/${{ matrix.target }}/release/bundle" "kit-hashes-${{ matrix.target }}.json"

      - name: Publish the sidecar hashes
        uses: actions/github-script@v8
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
          file: kit-hashes-${{ matrix.target }}.json
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const release_id = Number(process.env.release_id);
            const name = process.env.file;
            const { data: assets } = await github.rest.repos.listReleaseAssets({ owner, repo, release_id, per_page: 100 });
            for (const a of assets) {
              if (a.name === name) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
            }
            await github.rest.repos.uploadReleaseAsset({ owner, repo, release_id, name, data: fs.readFileSync(name) });

      - name: Dump Windows signing transcript on failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "sign-windows.log"
          if (Test-Path $log) {
            Write-Host "===== sign-windows.log ====="
            Get-Content $log
            Write-Host "===== end log ====="
          } else {
            Write-Host "No sign-windows.log at $log"
          }

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Rename release assets
        uses: actions/github-script@v8
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const releaseId = process.env.release_id;
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
            });

            // Tauri's update tarballs ship without the version in their
            // filename ("Your Own AI_aarch64.app.tar.gz"); the rename puts
            // it in, as the .dmg names have it.
            const version = context.ref.replace('refs/tags/v', '');
            const renames = {
              '_aarch64.dmg': '-macOS-Apple-Silicon.dmg',
              '_x64.dmg': '-macOS-Intel.dmg',
              '_amd64.deb': '-Linux.deb',
              '-1.x86_64.rpm': '-Linux.rpm',
              '_x64-setup.exe': '-Windows-Setup.exe',
              '_x64_en-US.msi': '-Windows.msi',
              '_aarch64.app.tar.gz': `_${version}-macOS-Apple-Silicon.app.tar.gz`,
              '_x64.app.tar.gz': `_${version}-macOS-Intel.app.tar.gz`,
              '_aarch64.app.tar.gz.sig': `_${version}-macOS-Apple-Silicon.app.tar.gz.sig`,
              '_x64.app.tar.gz.sig': `_${version}-macOS-Intel.app.tar.gz.sig`,
              '_x64-setup.exe.sig': '-Windows-Setup.exe.sig',
              '_x64_en-US.msi.sig': '-Windows.msi.sig',
              '_amd64.deb.sig': '-Linux.deb.sig',
              '-1.x86_64.rpm.sig': '-Linux.rpm.sig',
            };

            for (const asset of assets) {
              for (const [oldSuffix, newSuffix] of Object.entries(renames)) {
                if (asset.name.endsWith(oldSuffix)) {
                  const newName = asset.name.replace(oldSuffix, newSuffix);
                  console.log(`Renaming: ${asset.name} → ${newName}`);
                  await github.rest.repos.updateReleaseAsset({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    asset_id: asset.id,
                    name: newName,
                  });
                  break;
                }
              }
            }

      # The updater's version file (Tauri's latest.json), written after the
      # renames so its links are the final download names: each platform's
      # updater file and the content of its .sig. Two keys per platform: the
      # updater looks for <os>-<arch>-<installer> first, then <os>-<arch>.
      # The app reads it only after the release manifest (signed by Team
      # Flowsta, flowsta-dht-node tools/release-manifest.mjs) names the same
      # version. The links are built from the tag: the release is still a
      # draft here, and a draft asset's browser_download_url is a temporary
      # untagged-... address that stops working once the release is published.
      - name: Updater version file
        uses: actions/github-script@v8
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const release_id = Number(process.env.release_id);
            const version = context.ref.replace('refs/tags/v', '');
            const tag = context.ref.replace('refs/tags/', '');
            const { data: assets } = await github.rest.repos.listReleaseAssets({ owner, repo, release_id, per_page: 100 });
            const text = async (a) => Buffer.from((await github.request('GET /repos/{owner}/{repo}/releases/assets/{asset_id}', { owner, repo, asset_id: a.id, headers: { accept: 'application/octet-stream' } })).data).toString('utf8').trim();
            const files = [
              ['-macOS-Apple-Silicon.app.tar.gz', ['darwin-aarch64-app', 'darwin-aarch64']],
              ['-macOS-Intel.app.tar.gz', ['darwin-x86_64-app', 'darwin-x86_64']],
              ['-Windows-Setup.exe', ['windows-x86_64-nsis', 'windows-x86_64']],
              ['-Windows.msi', ['windows-x86_64-msi']],
              ['-Linux.deb', ['linux-x86_64-deb', 'linux-x86_64']],
              ['-Linux.rpm', ['linux-x86_64-rpm']],
            ];
            const platforms = {};
            for (const [suffix, keys] of files) {
              const file = assets.find((a) => a.name.endsWith(suffix));
              const sig = assets.find((a) => a.name.endsWith(`${suffix}.sig`));
              if (!file || !sig) { console.log(`no updater file for ${suffix}`); continue; }
              const signature = await text(sig);
              const url = `https://github.com/${owner}/${repo}/releases/download/${tag}/${encodeURIComponent(file.name)}`;
              for (const k of keys) platforms[k] = { signature, url };
            }
            if (Object.keys(platforms).length === 0) throw new Error('no updater files: is TAURI_SIGNING_PRIVATE_KEY set?');
            const latest = {
              version,
              notes: `https://github.com/${owner}/${repo}/releases/tag/${tag}`,
              pub_date: new Date().toISOString(),
              platforms,
            };
            for (const a of assets) {
              if (a.name === 'latest.json') await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
            }
            await github.rest.repos.uploadReleaseAsset({ owner, repo, release_id, name: 'latest.json', data: JSON.stringify(latest, null, 2) + '\n' });
            console.log(`latest.json: ${version}, ${Object.keys(platforms).join(', ')}`);

      # Hash the installers (after the renames above, so the names in
      # SHA256SUMS.txt match the final download filenames) and attach the
      # checksums file to the release. The updater's files leave the page when
      # the release manifest is signed (flowsta-dht-node tools/release-manifest.mjs),
      # so the checksums name what people download.
      - name: Generate SHA256 checksums
        uses: actions/github-script@v8
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const crypto = require('crypto');
            const releaseId = Number(process.env.release_id);
            const { owner, repo } = context.repo;

            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner, repo, release_id: releaseId, per_page: 100,
            });

            for (const a of assets) {
              if (a.name === 'SHA256SUMS.txt') {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
              }
            }

            const installer = (name) => /\.(dmg|deb|rpm|msi)$|-Setup\.exe$/.test(name);
            const lines = [];
            for (const a of assets) {
              if (!installer(a.name)) continue;
              const res = await github.request(
                'GET /repos/{owner}/{repo}/releases/assets/{asset_id}',
                { owner, repo, asset_id: a.id, headers: { accept: 'application/octet-stream' } }
              );
              const hash = crypto.createHash('sha256').update(Buffer.from(res.data)).digest('hex');
              lines.push(`${hash}  ${a.name}`);
              console.log(`${hash}  ${a.name}`);
            }
            lines.sort();

            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id: releaseId,
              name: 'SHA256SUMS.txt',
              data: lines.join('\n') + '\n',
            });

      - name: Publish release
        uses: actions/github-script@v8
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
            });
