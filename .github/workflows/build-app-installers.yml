name: Build App Installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-14
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Download llama-server binaries
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p src-tauri/bin
          REPO="WeAreFlowsta/Your-Own-AI"

          # PINNED llama.cpp engine version. Bump deliberately: run
          # build-llama-binaries.yml at a new tag, then update this one line.
          # (Was "latest llama-* release" built from master — unpinned drift.)
          RELEASE_TAG="llama-b9637"

          echo "📦 Using pinned llama-server release: ${RELEASE_TAG}"
          if ! gh release view "${RELEASE_TAG}" --repo ${REPO} >/dev/null 2>&1; then
            echo "❌ Error: pinned release ${RELEASE_TAG} not found — build it via build-llama-binaries.yml"
            exit 1
          fi

          # The app bakes this tag (engine.rs LLAMA_ENGINE_TAG) to download
          # optional engine builds from the same release - fail fast if the
          # two ever drift. (sed, not grep -P: macOS runners lack -P.)
          BAKED=$(sed -n 's/.*LLAMA_ENGINE_TAG: &str = "\([^"]*\)".*/\1/p' src-tauri/src/engine.rs)
          if [ "$BAKED" != "${RELEASE_TAG}" ]; then
            echo "❌ engine.rs LLAMA_ENGINE_TAG (${BAKED:-missing}) != workflow RELEASE_TAG (${RELEASE_TAG}) - update both together"
            exit 1
          fi
          echo "✅ engine.rs LLAMA_ENGINE_TAG matches (${BAKED})"

          echo "⬇️  Downloading binaries..."
          for BINARY in llama-server-x86_64-unknown-linux-gnu llama-server-aarch64-apple-darwin llama-server-x86_64-apple-darwin llama-server-x86_64-pc-windows-msvc.exe; do
            gh release download "${RELEASE_TAG}" --repo ${REPO} --pattern "${BINARY}" --dir src-tauri/bin/
            # Verify the download landed: gh release download can exit 0 with no
            # file when the pattern doesn't match, which would silently ship an
            # installer with no inference engine. Smallest real binary is ~12 MB.
            DEST="src-tauri/bin/${BINARY}"
            test -f "$DEST" || { echo "❌ ${BINARY} did not download"; exit 1; }
            SIZE=$(wc -c < "$DEST")
            test "$SIZE" -gt 5000000 || { echo "❌ ${BINARY} too small (${SIZE} bytes)"; exit 1; }
            echo "✅ ${BINARY} (${SIZE} bytes)"
          done

          chmod +x src-tauri/bin/llama-server-* 2>/dev/null || true
          echo "✅ All llama binaries downloaded"
          ls -lh src-tauri/bin/

      # Official Holochain release binaries, downloaded at build time —
      # same pattern as ProofPoll and Flowsta Vault (no more building
      # Holochain from source; build-holochain-binaries.yml is deprecated).
      # Only the current matrix target is fetched: Tauri's externalBin
      # resolves `yourowai-holochain-<target-triple>` per platform.
      - name: Download Holochain binaries (official release)
        shell: bash
        env:
          HC_RELEASE: holochain-0.6.1
        run: |
          mkdir -p src-tauri/binaries
          BASE="https://github.com/holochain/holochain/releases/download/${HC_RELEASE}"
          T="${{ matrix.target }}"
          EXT=""
          if [ "$T" = "x86_64-pc-windows-msvc" ]; then EXT=".exe"; fi
          for BIN in holochain lair-keystore; do
            DEST="src-tauri/binaries/yourowai-${BIN}-${T}${EXT}"
            curl -fsSL "${BASE}/${BIN}-${T}${EXT}" -o "$DEST"
            chmod +x "$DEST"
            test "$(wc -c < "$DEST")" -gt 1000000 || { echo "❌ ${BIN} download too small"; exit 1; }
            echo "✅ yourowai-${BIN}-${T}${EXT} (${HC_RELEASE})"
          done
          ls -lh src-tauri/binaries/

      # pdfium renders scanned-PDF pages for OCR. tauri.conf bundles
      # resources/pdfium/* but the binaries are gitignored - without this
      # fetch, every installer silently ships without scanned-PDF support.
      - name: Fetch pdfium (scanned-PDF rendering for OCR)
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu) PDFIUM_TARGET="linux-x64" ;;
            aarch64-apple-darwin)     PDFIUM_TARGET="mac-arm64" ;;
            x86_64-apple-darwin)      PDFIUM_TARGET="mac-x64" ;;
            x86_64-pc-windows-msvc)   PDFIUM_TARGET="win-x64" ;;
            *) echo "❌ No pdfium mapping for ${{ matrix.target }}"; exit 1 ;;
          esac
          ./scripts/fetch-pdfium.sh "$PDFIUM_TARGET"
          # Verify it landed - an empty resources dir bundles fine and only
          # fails at runtime when a user attaches a scanned PDF.
          FILE=$(ls src-tauri/resources/pdfium/libpdfium.so \
                    src-tauri/resources/pdfium/libpdfium.dylib \
                    src-tauri/resources/pdfium/pdfium.dll 2>/dev/null | head -1)
          test -n "$FILE" || { echo "❌ pdfium did not download"; exit 1; }
          SIZE=$(wc -c < "$FILE")
          test "$SIZE" -gt 3000000 || { echo "❌ pdfium too small (${SIZE} bytes)"; exit 1; }
          echo "✅ $FILE (${SIZE} bytes)"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v5
        with:
          name: app-linux-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 7

      - name: Zip macOS .app bundle
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          cd src-tauri/target/release/bundle/macos
          for app in *.app; do
            if [ -d "$app" ]; then
              zip -r "${app%.app}.zip" "$app"
            fi
          done
          ls -lh *.zip

      - name: Upload artifacts (macOS)
        if: startsWith(matrix.platform, 'macos-')
        uses: actions/upload-artifact@v5
        with:
          name: app-macos-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.zip
          retention-days: 7

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v5
        with:
          name: app-windows-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7

  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.zip" -o -name "*.msi" -o -name "*.exe" \) -exec cp {} release-files/ \;
          echo "Files to upload:"
          ls -lh release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Your Own AI v${{ github.event.inputs.version }}
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          body: |
            ## 🎉 Your Own AI v${{ github.event.inputs.version }}
            
            ### Downloads
            
            **Linux:**
            - `.deb` for Debian/Ubuntu
            - `.AppImage` for all distros
            
            **macOS:**
            - `.dmg` for installation (recommended)
            - `.zip` for portable .app bundle
            - ARM64 (Apple Silicon) and Intel builds
            
            **Windows:**
            - `.msi` installer
            - `.exe` portable
            
            ### What's New
            - Local AI chat with offline models
            - VRAM-aware model recommendations
            - Thinking text display for detailed responses
            - Custom AI personalities
            
            ---
            Built with ❤️ using Tauri + React
          files: release-files/*

