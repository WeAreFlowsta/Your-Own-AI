name: Tests

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "src-tauri/**"

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The tauri build script refuses to compile when an externalBin entry
      # is missing from disk, and the real sidecars are gitignored - unit
      # tests never execute them, so empty stubs are enough to build.
      - name: Stub sidecar binaries
        run: |
          mkdir -p src-tauri/bin src-tauri/binaries
          for n in bin/yourowai-llama-server binaries/yourowai-holochain binaries/yourowai-lair-keystore binaries/yourowai-holochain-07 binaries/yourowai-lair-keystore-07; do
            touch "src-tauri/${n}-x86_64-unknown-linux-gnu"
            chmod +x "src-tauri/${n}-x86_64-unknown-linux-gnu"
          done

      - name: Run unit tests
        working-directory: src-tauri
        run: cargo test --lib

  # macOS-gated code (diagnostics .ips parsing, Metal paths, the macOS crash
  # threshold) otherwise first compiles during a release build - too late to
  # fail. Public repo, so the pricier mac runner costs nothing.
  rust-tests-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Stub sidecar binaries
        run: |
          mkdir -p src-tauri/bin src-tauri/binaries
          for n in bin/yourowai-llama-server binaries/yourowai-holochain binaries/yourowai-lair-keystore binaries/yourowai-holochain-07 binaries/yourowai-lair-keystore-07; do
            for t in aarch64-apple-darwin x86_64-apple-darwin; do
              touch "src-tauri/${n}-${t}"
              chmod +x "src-tauri/${n}-${t}"
            done
          done

      - name: Run unit tests
        working-directory: src-tauri
        run: cargo test --lib

  # Windows-gated code (the machine check's input-idle and connection-cost
  # readers among it) otherwise first compiles during a release build. The
  # tests are compiled, not run: a test binary lacks the common-controls
  # manifest the app's own build embeds, so on Windows it stops before its
  # first test (STATUS_ENTRYPOINT_NOT_FOUND).
  rust-tests-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Stub sidecar binaries
        shell: bash
        run: |
          mkdir -p src-tauri/bin src-tauri/binaries
          for n in bin/yourowai-llama-server binaries/yourowai-holochain binaries/yourowai-lair-keystore binaries/yourowai-holochain-07 binaries/yourowai-lair-keystore-07; do
            touch "src-tauri/${n}-x86_64-pc-windows-msvc.exe"
          done

      - name: Build unit tests
        working-directory: src-tauri
        run: cargo test --lib --no-run
