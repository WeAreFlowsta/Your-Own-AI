name: Tests

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "src-tauri/**"

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The tauri build script refuses to compile when an externalBin entry
      # is missing from disk, and the real sidecars are gitignored - unit
      # tests never execute them, so empty stubs are enough to build.
      - name: Stub sidecar binaries
        run: |
          mkdir -p src-tauri/bin src-tauri/binaries
          for n in bin/llama-server binaries/yourowai-holochain binaries/yourowai-lair-keystore; do
            touch "src-tauri/${n}-x86_64-unknown-linux-gnu"
            chmod +x "src-tauri/${n}-x86_64-unknown-linux-gnu"
          done

      - name: Run unit tests
        working-directory: src-tauri
        run: cargo test --lib
