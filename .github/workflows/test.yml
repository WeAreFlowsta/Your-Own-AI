name: Tests

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "src/**"
      - "scripts/**"
      - "tools/**"
      - "e2e/fixtures/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - "src/**"
      - "scripts/**"
      - "tools/**"
      - "e2e/fixtures/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test.yml"

jobs:
  # The front end as a release builds it: the type check, both Vite builds
  # and every guard script in `npm run build` (closure order, the webview
  # floor, the reply boundary, action labels, line endings, no e2e feature).
  # Until this job, the first place a type error or a tripped guard showed
  # was a release build.
  front-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The tools that have tests of their own (the memory harness).
      - run: npm run test:tools

  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The tauri build script refuses to compile when an externalBin entry
      # is missing from disk, and the real sidecars are gitignored - unit
      # tests never execute them, so empty stubs are enough to build.
      - name: Stub sidecar binaries
        run: |
          mkdir -p src-tauri/bin src-tauri/binaries
          for n in bin/yourowai-llama-server binaries/yourowai-holochain binaries/yourowai-lair-keystore binaries/yourowai-holochain-07 binaries/yourowai-lair-keystore-07; do
            touch "src-tauri/${n}-x86_64-unknown-linux-gnu"
            chmod +x "src-tauri/${n}-x86_64-unknown-linux-gnu"
          done

      - name: Run unit tests
        working-directory: src-tauri
        run: cargo test --lib

  # macOS-gated code (diagnostics .ips parsing, Metal paths, the macOS crash
  # threshold) otherwise first compiles during a release build - too late to
  # fail. Public repo, so the pricier mac runner costs nothing.
  rust-tests-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Stub sidecar binaries
        run: |
          mkdir -p src-tauri/bin src-tauri/binaries
          for n in bin/yourowai-llama-server binaries/yourowai-holochain binaries/yourowai-lair-keystore binaries/yourowai-holochain-07 binaries/yourowai-lair-keystore-07; do
            for t in aarch64-apple-darwin x86_64-apple-darwin; do
              touch "src-tauri/${n}-${t}"
              chmod +x "src-tauri/${n}-${t}"
            done
          done

      - name: Run unit tests
        working-directory: src-tauri
        run: cargo test --lib

  # Windows-gated code (the machine check's input-idle and connection-cost
  # readers among it) otherwise first compiles during a release build. The
  # tests are compiled, not run: a test binary lacks the common-controls
  # manifest the app's own build embeds, so on Windows it stops before its
  # first test (STATUS_ENTRYPOINT_NOT_FOUND).
  rust-tests-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Stub sidecar binaries
        shell: bash
        run: |
          mkdir -p src-tauri/bin src-tauri/binaries
          for n in bin/yourowai-llama-server binaries/yourowai-holochain binaries/yourowai-lair-keystore binaries/yourowai-holochain-07 binaries/yourowai-lair-keystore-07; do
            touch "src-tauri/${n}-x86_64-pc-windows-msvc.exe"
          done

      # The installer's wait for the program file at an update, run for
      # real: the file is held for four seconds, as Windows can hold a
      # program that has just exited, and the installer must wait and then
      # write it. With no /UPDATE it must not wait.
      - name: Installer waits for the program file at an update
        shell: pwsh
        working-directory: src-tauri/windows
        run: |
          $makensis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { choco install nsis -y --no-progress | Out-Null }
          & $makensis /V2 hook-test.nsi
          if ($LASTEXITCODE -ne 0) { throw "the installer hooks did not compile" }
          New-Item -ItemType Directory -Force hook-test-inst | Out-Null
          $target = Join-Path (Get-Location) "hook-test-inst\hook-target.exe"
          function Hold([int]$seconds) {
            Set-Content -Path $target -Value "old"
            Start-Job -ArgumentList $target, $seconds -ScriptBlock {
              param($path, $secs)
              $f = [IO.File]::Open($path, 'Open', 'ReadWrite', 'None')
              Start-Sleep -Seconds $secs
              $f.Close()
            } | Out-Null
            Start-Sleep -Seconds 1
          }
          Hold 4
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $run = Start-Process .\hook-test.exe -ArgumentList "/UPDATE" -Wait -PassThru
          $took = $clock.Elapsed.TotalSeconds
          "update: exit $($run.ExitCode) after $([math]::Round($took, 1)) s; the file holds '$(Get-Content $target)'"
          if ($run.ExitCode -ne 0) { throw "at an update the held program file was not written" }
          if ($took -lt 2) { throw "the installer did not wait for the held file" }
          if ((Get-Content $target) -ne "new") { throw "the program file was not replaced" }
          Get-Job | Wait-Job | Remove-Job
          Hold 4
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $run = Start-Process .\hook-test.exe -Wait -PassThru
          $took = $clock.Elapsed.TotalSeconds
          "by hand: exit $($run.ExitCode) after $([math]::Round($took, 1)) s"
          if ($took -gt 2) { throw "an install by hand was held up by the update wait" }
          if ($run.ExitCode -ne 3) { throw "expected the held file to refuse the write when nothing waits" }
          Get-Job | Wait-Job | Remove-Job

      - name: Build unit tests
        working-directory: src-tauri
        run: cargo test --lib --no-run
