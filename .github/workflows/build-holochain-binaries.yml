# DEPRECATED (2026-06-11): app installers now download official Holochain
# release binaries directly (see build-app-installers.yml, pinned via
# HC_RELEASE) — the same pattern as ProofPoll and Flowsta Vault. Building
# from source is no longer part of the release path. Kept only as an
# emergency fallback for a target the official release doesn't cover.
name: Build Holochain Binaries (deprecated)

on:
  workflow_dispatch:
    inputs:
      holochain_version:
        description: 'Holochain version (e.g., 0.6.1)'
        required: true
        default: '0.6.1'
      lair_version:
        description: 'Lair keystore version (e.g., 0.6.3)'
        required: true
        default: '0.6.3'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Build holochain
        run: cargo install holochain --version ${{ github.event.inputs.holochain_version }} --locked

      - name: Build lair-keystore
        run: cargo install lair_keystore --version ${{ github.event.inputs.lair_version }} --locked

      - name: Verify binaries
        run: |
          holochain --version
          lair-keystore --version

      - name: Collect binaries
        run: |
          mkdir -p binaries
          cp "$(which holochain)" binaries/holochain
          cp "$(which lair-keystore)" binaries/lair-keystore
          strip binaries/holochain binaries/lair-keystore
          ls -lh binaries/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: holochain-linux-x64
          path: binaries/
          retention-days: 7

  build-macos-arm64:
    runs-on: macos-14
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Build holochain
        run: cargo install holochain --version ${{ github.event.inputs.holochain_version }} --locked

      - name: Build lair-keystore
        run: cargo install lair_keystore --version ${{ github.event.inputs.lair_version }} --locked

      - name: Verify binaries
        run: |
          holochain --version
          lair-keystore --version

      - name: Collect binaries
        run: |
          mkdir -p binaries
          cp "$(which holochain)" binaries/holochain
          cp "$(which lair-keystore)" binaries/lair-keystore
          strip binaries/holochain binaries/lair-keystore
          ls -lh binaries/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: holochain-macos-arm64
          path: binaries/
          retention-days: 7

  build-macos-x64:
    runs-on: macos-latest
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Build holochain for x86_64
        run: cargo install holochain --version ${{ github.event.inputs.holochain_version }} --locked --target x86_64-apple-darwin
        env:
          CARGO_BUILD_TARGET: x86_64-apple-darwin

      - name: Build lair-keystore for x86_64
        run: cargo install lair_keystore --version ${{ github.event.inputs.lair_version }} --locked --target x86_64-apple-darwin
        env:
          CARGO_BUILD_TARGET: x86_64-apple-darwin

      - name: Collect binaries
        run: |
          mkdir -p binaries
          cp "$HOME/.cargo/bin/holochain" binaries/holochain || cp "$(find $HOME/.cargo -name holochain -type f | head -1)" binaries/holochain
          cp "$HOME/.cargo/bin/lair-keystore" binaries/lair-keystore || cp "$(find $HOME/.cargo -name lair-keystore -type f | head -1)" binaries/lair-keystore
          file binaries/holochain
          strip binaries/holochain binaries/lair-keystore
          ls -lh binaries/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: holochain-macos-x64
          path: binaries/
          retention-days: 7

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Strawberry Perl (lair build dependency)
        run: choco install strawberryperl -y

      - name: Build holochain
        run: cargo install holochain --version ${{ github.event.inputs.holochain_version }} --locked

      - name: Build lair-keystore
        run: cargo install lair_keystore --version ${{ github.event.inputs.lair_version }} --locked

      - name: Verify binaries
        run: |
          holochain --version
          lair-keystore --version

      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path binaries
          Copy-Item (Get-Command holochain).Source binaries/holochain.exe
          Copy-Item (Get-Command lair-keystore).Source binaries/lair-keystore.exe
          Get-ChildItem binaries/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: holochain-windows-x64
          path: binaries/
          retention-days: 7

  create-release:
    needs: [build-linux, build-macos-arm64, build-macos-x64, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Create release tag
        id: tag
        run: |
          HC_VERSION="${{ github.event.inputs.holochain_version }}"
          LAIR_VERSION="${{ github.event.inputs.lair_version }}"
          TAG_NAME="holochain-${HC_VERSION}-lair-${LAIR_VERSION}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Rename binaries with platform triples
        run: |
          mkdir -p release
          mv binaries/holochain-linux-x64/holochain release/holochain-x86_64-unknown-linux-gnu
          mv binaries/holochain-linux-x64/lair-keystore release/lair-keystore-x86_64-unknown-linux-gnu
          mv binaries/holochain-macos-arm64/holochain release/holochain-aarch64-apple-darwin
          mv binaries/holochain-macos-arm64/lair-keystore release/lair-keystore-aarch64-apple-darwin
          mv binaries/holochain-macos-x64/holochain release/holochain-x86_64-apple-darwin
          mv binaries/holochain-macos-x64/lair-keystore release/lair-keystore-x86_64-apple-darwin
          mv binaries/holochain-windows-x64/holochain.exe release/holochain-x86_64-pc-windows-msvc.exe
          mv binaries/holochain-windows-x64/lair-keystore.exe release/lair-keystore-x86_64-pc-windows-msvc.exe
          chmod +x release/holochain-* release/lair-keystore-* 2>/dev/null || true
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "Holochain ${{ github.event.inputs.holochain_version }} + Lair ${{ github.event.inputs.lair_version }}"
          body: |
            Pre-built holochain and lair-keystore binaries for bundling with Your Own AI.

            **Versions:**
            - Holochain: ${{ github.event.inputs.holochain_version }}
            - Lair Keystore: ${{ github.event.inputs.lair_version }}

            **Platforms:**
            - Linux x86_64
            - macOS Apple Silicon (ARM64)
            - macOS Intel (x86_64)
            - Windows x64

            Built on: $(date -u)
          files: release/*
          draft: false
          prerelease: false
