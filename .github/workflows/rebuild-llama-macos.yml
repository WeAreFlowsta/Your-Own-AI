name: Rebuild macOS llama-server (hotfix)

# Targeted rebuild of ONLY the two macOS llama-server binaries, replacing
# those assets on an existing llama-* release. The beta-2 binaries linked
# Homebrew's OpenSSL (present on CI runners, absent on user Macs) and died
# at spawn with dyld "Library not loaded". The permanent fix lives in
# build-llama-binaries.yml; this gets it onto the pinned release without a
# full 6-platform rebuild. Safe to delete once a full build at a new tag
# supersedes it.

on:
  workflow_dispatch:
    inputs:
      llama_cpp_version:
        description: 'llama.cpp git tag (must match the release, e.g. b9637)'
        required: true
        default: 'b10355'
      release_tag:
        description: 'Release to replace the assets on (e.g. llama-b9637)'
        required: true
        default: 'llama-b10621'

permissions:
  contents: write

jobs:
  build-macos-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ github.event.inputs.llama_cpp_version }}

      - name: Build binary with Metal GPU support
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_STATIC=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_METAL=ON \
            -DLLAMA_CURL=OFF \
            -DLLAMA_SERVER_SSL=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON \
            -DLLAMA_SERVER_WEBUI=OFF
          cmake --build build --config Release --target llama-server -j $(sysctl -n hw.ncpu)

      - name: Verify binary
        run: |
          otool -L build/bin/llama-server
          if otool -L build/bin/llama-server | grep -E "/opt/homebrew/|/usr/local/opt/|libssl|libcrypto|libcurl"; then
            echo "llama-server links runner-only dylibs - it will crash on user Macs"; exit 1
          fi
          ./build/bin/llama-server --version
          strip build/bin/llama-server

      - name: Replace the release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/bin/llama-server llama-server-aarch64-apple-darwin
          gh release upload "${{ github.event.inputs.release_tag }}" \
            llama-server-aarch64-apple-darwin \
            --repo "${{ github.repository }}" --clobber
          echo "Replaced llama-server-aarch64-apple-darwin on ${{ github.event.inputs.release_tag }}"

  build-macos-x64:
    runs-on: macos-15
    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ github.event.inputs.llama_cpp_version }}

      - name: Build binary for x86_64 (CPU only, no Metal on Intel Macs)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_STATIC=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_AVX=ON \
            -DGGML_AVX2=ON \
            -DGGML_FMA=ON \
            -DGGML_F16C=ON \
            -DGGML_METAL=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_SERVER_SSL=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON \
            -DLLAMA_SERVER_WEBUI=OFF
          cmake --build build --config Release --target llama-server -j $(sysctl -n hw.ncpu)

      - name: Verify binary
        run: |
          file build/bin/llama-server
          otool -L build/bin/llama-server
          if otool -L build/bin/llama-server | grep -E "/opt/homebrew/|/usr/local/opt/|libssl|libcrypto|libcurl"; then
            echo "llama-server links runner-only dylibs - it will crash on user Macs"; exit 1
          fi
          strip build/bin/llama-server

      - name: Replace the release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/bin/llama-server llama-server-x86_64-apple-darwin
          gh release upload "${{ github.event.inputs.release_tag }}" \
            llama-server-x86_64-apple-darwin \
            --repo "${{ github.repository }}" --clobber
          echo "Replaced llama-server-x86_64-apple-darwin on ${{ github.event.inputs.release_tag }}"
