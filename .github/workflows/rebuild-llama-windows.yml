name: Rebuild Windows llama-server (hotfix)

# Targeted rebuild of ONLY the Windows Vulkan llama-server, replacing that one
# asset on an existing llama-* release. Use for a Windows-only engine fix
# (e.g. the OpenSSL-DLL crash) without a ~3h full 6-platform rebuild that also
# churns the verified CUDA zips. The permanent fix lives in
# build-llama-binaries.yml; this just gets it onto the pinned release fast.
# Safe to delete once a full build at a new tag supersedes it.

on:
  workflow_dispatch:
    inputs:
      llama_cpp_version:
        description: 'llama.cpp git tag (must match the release, e.g. b9637)'
        required: true
        default: 'b10355'
      release_tag:
        description: 'Release to replace the asset on (e.g. llama-b9637)'
        required: true
        default: 'llama-b10621'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v1.1

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.0.0
        with:
          vulkan_version: 1.4.309.0
          install_runtime: false
          cache: true
          stripdown: false

      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ github.event.inputs.llama_cpp_version }}

      - name: Provide SPIRV-Headers
        shell: pwsh
        run: |
          git clone --depth 1 --branch vulkan-sdk-1.4.309.0 https://github.com/KhronosGroup/SPIRV-Headers.git spirv-headers-src
          cmake -B spirv-headers-src/build -S spirv-headers-src -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/spirv-prefix"
          cmake --build spirv-headers-src/build --target install --config Release

      - name: Build binary with Vulkan GPU support
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/spirv-prefix" `
            -DBUILD_SHARED_LIBS=OFF `
            -DGGML_STATIC=ON `
            -DGGML_NATIVE=OFF `
            -DGGML_AVX=ON `
            -DGGML_AVX2=ON `
            -DGGML_FMA=ON `
            -DGGML_F16C=ON `
            -DGGML_VULKAN=ON `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW `
            -DLLAMA_CURL=OFF `
            -DLLAMA_SERVER_SSL=OFF `
            -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON `
            -DLLAMA_SERVER_WEBUI=OFF
          cmake --build build --config Release --target llama-server

      - name: Guard - no dynamic OpenSSL dependency
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("build/bin/Release/llama-server.exe")
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($ascii -match "libcrypto-3|libssl-3|libcrypto-1|libssl-1") {
            throw "llama-server.exe still imports OpenSSL DLLs - it will crash on clean machines."
          }
          if ($ascii -match "MSVCP140.dll|VCRUNTIME140") {
            throw "llama-server.exe imports the dynamic MSVC runtime - build with static CRT."
          }
          Write-Host "OK: no OpenSSL or dynamic-CRT imports"

      - name: Verify binary
        run: |
          .\build\bin\Release\llama-server.exe --version

      # Mirror of the signing in build-llama-binaries.yml - a hotfix must
      # never replace a signed exe with an unsigned one.
      - name: Checkout app repo (signing script)
        uses: actions/checkout@v4
        with:
          path: app-repo

      - name: Setup Java (CodeSignTool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download CodeSignTool
        shell: pwsh
        run: |
          $url = "https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2.zip"
          $zip = Join-Path $env:RUNNER_TEMP "CodeSignTool.zip"
          $dest = Join-Path $env:RUNNER_TEMP "CodeSignTool"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          "CODE_SIGN_TOOL_DIR=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Sign llama-server.exe
        shell: pwsh
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
        run: |
          & app-repo/src-tauri/scripts/sign-windows.ps1 build/bin/Release/llama-server.exe
          $sig = Get-AuthenticodeSignature build/bin/Release/llama-server.exe
          if ($sig.Status -ne 'Valid') { throw "Signature not valid after signing: $($sig.Status)" }

      - name: Replace the release asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/bin/Release/llama-server.exe llama-server-x86_64-pc-windows-msvc.exe
          gh release upload "${{ github.event.inputs.release_tag }}" \
            llama-server-x86_64-pc-windows-msvc.exe \
            --repo "${{ github.repository }}" --clobber
          echo "Replaced llama-server-x86_64-pc-windows-msvc.exe on ${{ github.event.inputs.release_tag }}"
