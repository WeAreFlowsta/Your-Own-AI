[package]
name = "app"
version = "0.9.1-beta.6"
description = "Offline-first AI App"
authors = ["Your Own AI"]
homepage = "https://yourownai.net"
# The app's binary is your-own-ai (0.9.0 and earlier: app). The census tool
# is an example (`cargo run --example census`): the bundler packages every
# [[bin]], built or not, and never an example.
default-run = "your-own-ai"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "your-own-ai"
path = "src/main.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-http = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
axum = "0.7"
async-stream = "0.3"
sysinfo = "0.33"
futures = "0.3"
ash = "0.38"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-clipboard-manager = "2"
zip = "7"
# Already in the tree via holochain_sqlite (same version) - a direct
# declaration adds no new native code. Used to read OpenCode's session db.
rusqlite = "0.37"
calamine = "0.36.1"
pdf-extract = "0.12.0"
# OCR for scanned PDFs (optional models downloaded at runtime). pdfium renders any
# page (incl. CCITT/JBIG2 scans); ocrs (pure-Rust, RTen) does text recognition.
# rten pinned to ocrs 0.11's version so the `Model` type unifies.
ocrs = "0.11"
rten = "0.22"
pdfium-render = "0.8"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-log = "2"
log = "0.4"

# Holochain: the key store and conductor run through flowsta-hc-lines,
# which starts, supervises and stops each Holochain line. The client crates
# are pinned to the versions the library pins for the 0.6 line (0.6.1 pins
# lair_keystore_api to exactly 0.6.3; holochain_client 0.8.1 and
# holochain_types 0.6.1 move in lockstep with the conductor).
# The app's own updates: the updater plugin (Tauri's signature on the file)
# and flowsta-update-check (the release manifest Team Flowsta signs).
tauri-plugin-updater = "~2.12.0"
flowsta-update-check = { git = "https://github.com/WeAreFlowsta/flowsta-update-check", rev = "1e892e20aa577a3ece65945b3d8f0fd4b95532f6" }
url = "2"
flowsta-hc-lines = { git = "https://github.com/WeAreFlowsta/flowsta-hc-lines", rev = "e8b3d68633ef3982f6aa812a03c0195ef900e31e" }
async-trait = "0.1"
lair_keystore_api = "=0.6.3"
holochain_client = { version = "=0.8.1", default-features = false }
holochain_types = "=0.6.1"
mr_bundle = "=0.6.1"
rmp-serde = "1"
hex = "0.4"
sha2 = "0.10"
flate2 = "1"
# Transcript encryption (Phase A): XSalsa20-Poly1305 secretbox with the
# user-level data key.
crypto_secretbox = "0.1"
rand = "0.8"
base64 = "0.22"
ed25519-dalek = "2"
percent-encoding = "2"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-deep-link = "2"
blake3 = "1.8"
tauri-plugin-notification = "2.3"
# UI test harness only (e2e/README.md): an embedded WebDriver
# server inside the app. Behind the `e2e` feature, which no release build
# carries - scripts/check-no-e2e-feature.mjs proves it.
tauri-plugin-wdio-webdriver = { version = "1.4", optional = true }

# ML inference (OCR via ocrs/rten) is unusably slow in an unoptimised debug build —
# a single scanned page took ~2 min. Compile just the ML crates with optimisations
# even in dev, so OCR runs at near-release speed while our own code stays debuggable.
[features]
default = []
# Test builds only: `npm run e2e` builds with `--features e2e`.
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[profile.dev.package.rten]
opt-level = 3
[profile.dev.package."rten-base"]
opt-level = 3
[profile.dev.package."rten-gemm"]
opt-level = 3
[profile.dev.package."rten-simd"]
opt-level = 3
[profile.dev.package."rten-tensor"]
opt-level = 3
[profile.dev.package."rten-model-file"]
opt-level = 3
[profile.dev.package.ocrs]
opt-level = 3

[dev-dependencies]
tempfile = "3"

# A helper model runs below the person's own programs (llm.rs `lower_priority`)
# and the machine check reads the person's input idle on Windows (machine.rs);
# the same crates the lines library already builds with.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse"] }
# Whether the connection is metered, for the update download (machine.rs);
# the version Tauri already builds.
windows = { version = "0.61", features = ["Networking_Connectivity"] }

# Whether the connection is metered (Network.framework's path monitor takes a
# block; machine.rs); the version Tauri already builds.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"

# The machine check asks GNOME or the freedesktop screensaver how long the
# person has been away (machine.rs); the zbus the notification plugin builds.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

