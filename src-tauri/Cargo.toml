[package]
name = "app"
version = "0.9.0"
description = "Offline-first AI App"
authors = ["Your Own AI"]
homepage = "https://yourownai.net"
# The app's binary is your-own-ai (0.9.0 and earlier: app). `cargo run`
# launches it; the census tool builds only with its feature.
default-run = "your-own-ai"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "your-own-ai"
path = "src/main.rs"

# A developer tool: never built for a release, so never packaged.
[[bin]]
name = "census"
path = "src/bin/census.rs"
required-features = ["census"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-http = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
axum = "0.7"
async-stream = "0.3"
sysinfo = "0.33"
futures = "0.3"
ash = "0.38"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-clipboard-manager = "2"
zip = "7"
# Already in the tree via holochain_sqlite (same version) - a direct
# declaration adds no new native code. Used to read OpenCode's session db.
rusqlite = "0.37"
calamine = "0.36.1"
pdf-extract = "0.12.0"
# OCR for scanned PDFs (optional models downloaded at runtime). pdfium renders any
# page (incl. CCITT/JBIG2 scans); ocrs (pure-Rust, RTen) does text recognition.
# rten pinned to ocrs 0.11's version so the `Model` type unifies.
ocrs = "0.11"
rten = "0.22"
pdfium-render = "0.8"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-log = "2"
log = "0.4"

# Holochain: the key store and conductor run through flowsta-hc-lines,
# which starts, supervises and stops each Holochain line. The client crates
# are pinned to the versions the library pins for the 0.6 line (0.6.1 pins
# lair_keystore_api to exactly 0.6.3; holochain_client 0.8.1 and
# holochain_types 0.6.1 move in lockstep with the conductor).
flowsta-hc-lines = { git = "https://github.com/WeAreFlowsta/flowsta-hc-lines", rev = "b8b1559a6b5cae2cea2ff61f69f458942a0428f5" }
async-trait = "0.1"
lair_keystore_api = "=0.6.3"
holochain_client = { version = "=0.8.1", default-features = false }
holochain_types = "=0.6.1"
mr_bundle = "=0.6.1"
rmp-serde = "1"
hex = "0.4"
sha2 = "0.10"
flate2 = "1"
# Transcript encryption (Phase A): XSalsa20-Poly1305 secretbox with the
# user-level data key.
crypto_secretbox = "0.1"
rand = "0.8"
base64 = "0.22"
ed25519-dalek = "2"
percent-encoding = "2"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-deep-link = "2"
blake3 = "1.8"
tauri-plugin-notification = "2.3"
# UI test harness only (e2e/README.md): an embedded WebDriver
# server inside the app. Behind the `e2e` feature, which no release build
# carries - scripts/check-no-e2e-feature.mjs proves it.
tauri-plugin-wdio-webdriver = { version = "1.4", optional = true }

# ML inference (OCR via ocrs/rten) is unusably slow in an unoptimised debug build —
# a single scanned page took ~2 min. Compile just the ML crates with optimisations
# even in dev, so OCR runs at near-release speed while our own code stays debuggable.
[features]
default = []
# The census tool (src/bin/census.rs): `cargo run --bin census --features census`.
census = []
# Test builds only: `npm run e2e` builds with `--features e2e`.
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[profile.dev.package.rten]
opt-level = 3
[profile.dev.package."rten-base"]
opt-level = 3
[profile.dev.package."rten-gemm"]
opt-level = 3
[profile.dev.package."rten-simd"]
opt-level = 3
[profile.dev.package."rten-tensor"]
opt-level = 3
[profile.dev.package."rten-model-file"]
opt-level = 3
[profile.dev.package.ocrs]
opt-level = 3

[dev-dependencies]
tempfile = "3"

