[package]
name = "app"
version = "0.6.0-beta.1"
description = "Offline-first AI App"
authors = ["Your Own AI"]
homepage = "https://yourownai.net"
# Required since bin/census.rs exists: tauri dev's bare `cargo run`
# must keep launching the app, not the census tool.
default-run = "app"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-http = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
axum = "0.7"
async-stream = "0.3"
sysinfo = "0.33"
futures = "0.3"
ash = "0.38"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-clipboard-manager = "2"
zip = "7"
# Already in the tree via holochain_sqlite (same version) - a direct
# declaration adds no new native code. Used to read OpenCode's session db.
rusqlite = "0.37"
calamine = "0.36.1"
pdf-extract = "0.12.0"
# OCR for scanned PDFs (optional models downloaded at runtime). pdfium renders any
# page (incl. CCITT/JBIG2 scans); ocrs (pure-Rust, RTen) does text recognition.
# rten pinned to ocrs 0.11's version so the `Model` type unifies.
ocrs = "0.11"
rten = "0.22"
pdfium-render = "0.8"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-log = "2"
log = "0.4"

# Holochain (conductor + lair keystore management)
# Pinned to the Holochain 0.6.1-compatible set proven in ProofPoll:
# 0.6.1 pins lair_keystore_api to exactly 0.6.3, and holochain_client
# 0.8.1 / holochain_types 0.6.1 move in lockstep with the conductor.
lair_keystore_api = "=0.6.3"
holochain_client = { version = "=0.8.1", default-features = false }
holochain_types = "=0.6.1"
mr_bundle = "=0.6.1"
rmp-serde = "1"
hex = "0.4"
sha2 = "0.10"
flate2 = "1"
# Transcript encryption (Phase A): XSalsa20-Poly1305 secretbox with the
# user-level data key.
crypto_secretbox = "0.1"
rand = "0.8"
base64 = "0.22"
ed25519-dalek = "2"
percent-encoding = "2"
tauri-plugin-single-instance = "2.4.3"

# ML inference (OCR via ocrs/rten) is unusably slow in an unoptimised debug build —
# a single scanned page took ~2 min. Compile just the ML crates with optimisations
# even in dev, so OCR runs at near-release speed while our own code stays debuggable.
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package."rten-base"]
opt-level = 3
[profile.dev.package."rten-gemm"]
opt-level = 3
[profile.dev.package."rten-simd"]
opt-level = 3
[profile.dev.package."rten-tensor"]
opt-level = 3
[profile.dev.package."rten-model-file"]
opt-level = 3
[profile.dev.package.ocrs]
opt-level = 3

# Linux: prctl(PR_SET_PDEATHSIG) so lair/conductor die with the app (process_ext.rs).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Windows: hide spawned lair/holochain/llama-server console windows post-spawn
# (EnumWindows + ShowWindow) and tie them to a kill-on-close Job Object so they
# die with the app instead of orphaning and holding the lair pipe / ports.
# See process_ext.rs (ported from Flowsta Vault).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Pipes",
] }
